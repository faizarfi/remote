<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)" stroke="url(#rim)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- TV Body Outline -->
  <rect x="156" y="80" width="200" height="340" rx="36" fill="#1e2436" stroke="#38bdf8" stroke-width="6"/>
  
  <!-- IR LED Top -->
  <rect x="236" y="66" width="40" height="14" rx="6" fill="#ef4444"/>
  <circle cx="256" cy="73" r="10" fill="#ff4d4d" opacity="0.8"/>
  
  <!-- Screen Area -->
  <rect x="180" y="115" width="152" height="60" rx="12" fill="#05070a" stroke="#334155" stroke-width="3"/>
  <circle cx="196" cy="132" r="5" fill="#10b981"/>
  <rect x="210" y="129" width="70" height="6" rx="3" fill="#38bdf8"/>
  <rect x="196" y="150" width="120" height="8" rx="4" fill="#38bdf8" opacity="0.6"/>
  
  <!-- Power Button -->
  <circle cx="204" cy="208" r="16" fill="#ef4444"/>
  <!-- Mute Button -->
  <rect x="272" y="196" width="48" height="24" rx="8" fill="#334155"/>
  
  <!-- D-Pad Navigation -->
  <circle cx="256" cy="285" r="46" fill="#171a25" stroke="#475569" stroke-width="3"/>
  <circle cx="256" cy="285" r="20" fill="#38bdf8"/>
  
  <!-- Rockers -->
  <rect x="184" y="348" width="34" height="46" rx="12" fill="#334155"/>
  <rect x="294" y="348" width="34" height="46" rx="12" fill="#334155"/>
  
  <!-- App Dot -->
  <rect x="234" y="358" width="44" height="26" rx="8" fill="#e50914"/>
</svg>
